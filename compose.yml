name: wagering

x-app: &app
  build: .
  restart: unless-stopped
  stop_grace_period: 30s
  environment: &app-env
    DATABASE_URL: postgres://postgres:postgres@postgres:5432/wagering
    AWS_ENDPOINT_URL: http://localstack:4566
    AWS_REGION: us-east-1
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test
    WAGER_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
    WAGER_DLQ_URL: http://localstack:4566/000000000000/wager-transactions-dlq.fifo
    EVENTS_QUEUE_URL: http://localstack:4566/000000000000/wallet-events.fifo
  depends_on: &app-deps
    postgres:
      condition: service_healthy
    localstack:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

x-healthcheck: &app-healthcheck
  test:
    - CMD
    - bun
    - -e
    - "fetch('http://localhost:'+process.env.PORT+'/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
  interval: 3s
  timeout: 5s
  retries: 30
  start_period: 5s

services:
  postgres:
    image: postgres:17-alpine
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wagering
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  localstack:
    image: localstack/localstack:4
    environment:
      SERVICES: sqs
    ports:
      - "4567:4566"
    volumes:
      - ./infra/localstack/init/ready.d:/etc/localstack/init/ready.d
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs list-queues | grep -q wallet-events.fifo"]
      interval: 3s
      timeout: 5s
      retries: 30

  migrate:
    build: .
    command: ["bun", "src/main.migrate.ts", "up"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/wagering
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ["bun", "src/main.api.ts"]
    environment:
      <<: *app-env
      PORT: "3000"
    ports:
      - "3000:3000"
    healthcheck: *app-healthcheck

  consumer:
    <<: *app
    command: ["bun", "src/main.consumer.ts"]
    environment:
      <<: *app-env
      PORT: "3001"
    healthcheck: *app-healthcheck

  workers:
    <<: *app
    command: ["bun", "src/main.workers.ts"]
    environment:
      <<: *app-env
      PORT: "3002"
    healthcheck: *app-healthcheck
